spring.application.name=backend

# Load optional local development configuration (ignored in version control)
spring.config.import=optional:application-local.properties

# Server Configuration (Render injects PORT, fallback to SERVER_PORT or 8080)
server.port=${PORT:${SERVER_PORT:8080}}

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_builder}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration (Key must be at least 256 bits / 32 characters for HMAC-SHA256)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Provider Configuration
ai.provider=${AI_PROVIDER:openai}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# CORS Configuration (comma-separated allowed origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Rate Limiting (in-memory, single-node — see RateLimitFilter.java)
# Window duration in seconds (default: 60 = 1 minute)
rate.limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
# Max login attempts per IP per window (default: 10)
rate.limit.login.max=${RATE_LIMIT_LOGIN_MAX:10}
# Max AI enhance calls per authenticated user per window (default: 20)
rate.limit.ai.max=${RATE_LIMIT_AI_MAX:20}
