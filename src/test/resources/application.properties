# =============================================================================
# Automated Test Configuration
# This file is ONLY used during mvn test / mvn verify.
# Uses H2 in-memory database so tests pass without a running MySQL server.
# =============================================================================
spring.application.name=backend-test
server.port=0

# Do NOT import application-local.properties in tests — it may not exist in CI
spring.config.import=

# H2 in-memory DB with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate — create schema fresh for each test run
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret Key (≥32 bytes, safe to commit — tests only, never production)
jwt.secret=test_jwt_secret_key_minimum_32_characters_for_hs256_testing_only_123456
jwt.expiration=86400000

# AI Provider Test Defaults (no real calls made in tests)
ai.provider=openai
ai.base-url=https://api.openai.com/v1
ai.api-key=
ai.model=gpt-4o-mini
ai.timeout-seconds=30

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:5174
